# The gate that stops a broken commit reaching production.
#
# On 2026-08-06 commit 925d8b5f shipped a component that read a type its own
# context file did not yet declare — the context was still uncommitted WIP, so
# LOCAL tsc was green and Vercel's clean build failed. Production served the
# PREVIOUS build for forty minutes with none of that day's fixes live, and
# nothing told anybody. Two rules follow from that:
#
#   1. Typecheck from a COLD cache. `tsconfig.tsbuildinfo` makes incremental
#      tsc skip unchanged regions and report green on a tree Vercel rejects
#      (bitten again 2026-07-01). `.next/dev` is removed for the same reason.
#   2. Typecheck what git HAS, not what the working tree holds. Actions checks
#      out the commit, so an uncommitted file cannot prop the build up.
#
# Deliberately minimal: no secrets, no database, no Stripe, no Resend, no
# deploy. Every test in tests/ is a pure unit or repo-scanning test and needs
# none of those. Adding a step that needs a secret makes this gate un-runnable
# locally and skippable on a fork — don't.
#
# RULE 3, added 2026-08-06 the hard way. tsc and vitest are both STRUCTURALLY
# BLIND to route configuration — neither one parses the middleware matcher, the
# next.config redirect sources, or anything else path-to-regexp compiles. A
# matcher of `/docs:suffix(-|_)?:rest*` is two adjacent parameters, which Next
# rejects at BUILD time ("Must have text between two parameters"). tsc printed
# nothing and 1424 tests passed, so this gate as originally written would have
# waved it through with a green tick.
#
# It shipped. The deploy went to ERROR, production stayed on the previous build,
# and because that commit was the one DELETING a directory that served the whole
# paid toolkit unauthenticated, the failed build held a live paywall bypass open
# for a further eleven minutes. A build failure is not merely "the new thing is
# missing" — it PINS production to the old state, which is the dangerous half.
#
# So the gate builds. It is the only step here that reads route config at all.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # A clean typecheck. Zero output is the pass condition — tsc --noEmit
      # prints nothing at all when it is happy, so anything on stdout is a
      # finding even if the exit code were somehow 0.
      - name: Typecheck (cold cache)
        run: |
          rm -rf .next/dev
          rm -f tsconfig.tsbuildinfo
          out="$(npx tsc --noEmit 2>&1)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::tsc --noEmit produced output; the build Vercel runs will fail"
            exit 1
          fi
          echo "tsc --noEmit: 0 lines"

      # Fully green, and no skips. A skipped test is an unlocked defect class
      # that still reads as a pass on the summary line.
      - name: Tests
        run: npx vitest run --reporter=default --reporter=json --outputFile=.vitest-result.json

      - name: No skipped tests
        if: always()
        run: |
          node -e '
            const fs = require("fs")
            if (!fs.existsSync(".vitest-result.json")) {
              console.error("::error::no vitest result file — the run did not complete")
              process.exit(1)
            }
            const r = JSON.parse(fs.readFileSync(".vitest-result.json", "utf8"))
            const skipped = (r.numPendingTests ?? 0) + (r.numTodoTests ?? 0)
            console.log(`${r.numPassedTests} passed, ${r.numFailedTests} failed, ${skipped} skipped, across ${(r.testResults ?? []).length} files`)
            if (r.numFailedTests > 0 || !r.success) {
              console.error("::error::test failures")
              process.exit(1)
            }
            if (skipped > 0) {
              const names = (r.testResults ?? [])
                .flatMap(f => (f.assertionResults ?? []).filter(a => a.status !== "passed").map(a => `${f.name}: ${a.fullName} [${a.status}]`))
              console.error("::error::skipped tests are unlocked defect classes wearing a green tick\n" + names.join("\n"))
              process.exit(1)
            }
          '

      # The step tsc and vitest cannot stand in for. This compiles the route
      # manifest, so it is the ONLY thing here that validates a middleware
      # matcher or a next.config redirect source. It also catches a bad import,
      # a server/client boundary violation, and a page that throws while being
      # statically generated — none of which typecheck as errors.
      #
      # No secrets: the build must already survive their absence, because Vercel
      # builds with build-time env only and every runtime secret in this repo is
      # read inside a request handler. A page that needs a secret AT BUILD TIME
      # is itself the bug this step should surface.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          out="$(npx next build 2>&1)" || {
            echo "$out"
            echo "::error::next build failed — this commit would deploy to ERROR and PIN production to the previous build"
            exit 1
          }
          echo "$out" | tail -30
          # Next exits 0 on some route-config problems while still printing the
          # parse error, so the text is checked as well as the status.
          if echo "$out" | grep -qiE "Invalid (route source|source)|Must have text between two parameters|Error parsing"; then
            echo "::error::route configuration failed to parse — check middleware matcher / next.config sources"
            exit 1
          fi

  # The gate above proves the commit CAN build. This one proves it actually
  # REACHED production — a different question, and the one nobody was asking.
  #
  # A failed deploy does not leave a gap where the new code should be; it pins
  # production to the PREVIOUS build and everything keeps reporting healthy.
  # /api/health returned {"status":"healthy"} throughout both incidents on
  # 2026-08-06 because it only pinged Postgres. Twenty cron jobs, tsc and vitest
  # were all equally blind. The second incident held a live paywall bypass open,
  # because the commit that failed was the one deleting the leaking directory.
  #
  # So: poll the SHA production is serving until it equals the SHA we just
  # built. Cheap, needs no Vercel token, and fails loudly on BOTH failure modes
  # — the deploy errored, or the deploy silently never happened.
  deployed:
    name: reached production
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Full history: the check below asks whether the live commit is an
      # ANCESTOR of this one, which needs more than the default depth-1 clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until production is serving this commit or newer
        env:
          EXPECTED: ${{ github.sha }}
          URL: https://portal.concussion-education-australia.com/api/health
        run: |
          # WHAT THIS ASSERTS, and why it is not "the live SHA equals mine".
          #
          # The first version of this job demanded an exact match and failed on
          # 2026-08-06 while production was perfectly healthy. Six commits went
          # out in quick succession; Vercel supersedes an in-flight build when a
          # newer one arrives, so the intermediate SHAs NEVER serve. The job sat
          # waiting 18 minutes for a commit that could not appear, then cried
          # wolf. A monitor that reports failure on a healthy system is worse
          # than no monitor, because the next real alert gets ignored.
          #
          # The property that actually matters is that production is not STUCK
          # BEHIND this commit. So:
          #   live == mine        -> shipped
          #   mine is ancestor of live -> superseded by a newer push, fine
          #   live is ancestor of mine -> PRODUCTION IS BEHIND -> fail
          echo "expecting $EXPECTED or a descendant"
          for i in $(seq 1 60); do
            body="$(curl -fsS --max-time 15 "$URL" || true)"
            got="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).build?.sha??"")}catch{console.log("")}})')"
            if [ -n "$got" ]; then
              if [ "$got" = "$EXPECTED" ]; then
                echo "live after $((i*10))s: $got"
                exit 0
              fi
              # THE COMMIT BEING SERVED MAY NOT BE IN THIS CLONE.
              #
              # checkout@v4 fetches history up to github.sha. A commit pushed
              # AFTER this job started does not exist locally, so merge-base
              # errors, the superseded case is never detected, and the job
              # polls for a SHA that can never appear until it times out.
              #
              # That is exactly what happened: five commits went out in quick
              # succession, and every run for a superseded commit failed after
              # the full timeout and emailed a failure for a perfectly healthy
              # production. Second false-alarm bug in this same job — the first
              # was demanding an exact match at all.
              #
              # Fetching main first makes the newer commit resolvable.
              git fetch --quiet origin main 2>/dev/null || true
              if git merge-base --is-ancestor "$EXPECTED" "$got" 2>/dev/null; then
                echo "superseded: production serves ${got:0:8}, which already contains ${EXPECTED:0:8}"
                exit 0
              fi
            fi
            [ $((i % 6)) -eq 0 ] && echo "  ${i}0s — serving ${got:-<no sha>}"
            sleep 10
          done
          echo "::error::production never reached $EXPECTED or a descendant — it is serving ${got:-<unknown>}, which does NOT contain this commit. The deploy failed or never ran, so production is PINNED to an older build including any security fix in this commit. Check the Vercel deployment log."
          exit 1

      # THE PAYWALL, TESTED AS A STRANGER SEES IT.
      #
      # Two separate leaks of the entire paid Clinical Toolkit shipped on
      # 2026-08-06 — a backup directory, then print-resolution renders — and
      # both were found by hand, five sweeps apart. Unit tests could not see
      # either: they check the SOURCE, and the leak was a FILE sitting in a
      # CDN-served directory. The only honest test is an unauthenticated fetch
      # of the real thing.
      #
      # Runs after the deploy check, so it tests the build this commit produced.
      - name: Paid documents must refuse an anonymous request
        env:
          BASE: https://portal.concussion-education-australia.com
        run: |
          fail=0
          # Every path named in PAID_DOCS, read from the source so a new paid
          # document is covered the moment it is added to the list.
          paths="$(node -e '
            const s = require("fs").readFileSync("lib/gated-docs.ts","utf8")
            const m = /PAID_DOCS[^=]*=\s*new Set\(\[([\s\S]*?)\]\)/.exec(s)
            const out = [...m[1].matchAll(/'"'"'(\/docs\/[^'"'"']+)'"'"'/g)].map(x => x[1])
            if (out.length < 5) { console.error("only " + out.length + " paid docs parsed"); process.exit(1) }
            console.log(out.join("\n"))
          ')"
          echo "$paths" | while read -r p; do [ -n "$p" ] && echo "  covering $p"; done
          while read -r p; do
            [ -z "$p" ] && continue
            enc="$(node -e 'console.log(encodeURI(process.argv[1]))' "$p")"
            for variant in "$enc" "/${enc#/}" "$(echo "$enc" | sed 's#/docs/#/docs//#')" "$(echo "$enc" | sed 's#/docs/#/DOCS/#')" "$enc?x=1"; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$variant")"
              if [ "$code" = "200" ]; then
                echo "::error::PAYWALL BYPASS — $variant returned 200 to an anonymous request"
                fail=1
              fi
            done
          done <<< "$paths"
          # The backup/preview directories that leaked before must stay gone.
          for gone in /docs_backup_2026-01/RehabFlow.png /toolkit-previews/07_rehab_flow.png; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$gone")"
            [ "$code" = "200" ] && { echo "::error::a previously-removed leak is serving again: $gone"; fail=1; }
          done
          [ "$fail" = "0" ] && echo "all paid documents refuse anonymous requests" || exit 1
