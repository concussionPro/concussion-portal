<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SST Trainer</title>
<style>
  /* Shown by Capacitor server.errorPath when the live app fails to load.
     Must be fully self-contained — no network requests of any kind. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .wrap { max-width: 340px; }
  .dot {
    width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%;
    border: 3px solid #134e4a; display: flex; align-items: center; justify-content: center;
  }
  .dot::after { content: ''; width: 18px; height: 18px; border-radius: 50%; background: #2dd4bf; }
  h1 { font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.5; color: #94a3b8; margin-bottom: 24px; }
  button {
    appearance: none; border: 0; border-radius: 12px; padding: 14px 28px;
    background: #0d9488; color: #fff; font-size: 16px; font-weight: 600;
    width: 100%; cursor: pointer;
  }
  button:active { background: #0f766e; }
  .hint { margin-top: 14px; font-size: 13px; color: #64748b; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dot" aria-hidden="true"></div>
    <h1>Connection needed</h1>
    <p>SST Trainer couldn&rsquo;t reach the clinic server. Check you&rsquo;re online, then try again.</p>
    <button onclick="window.location.replace('https://portal.concussion-education-australia.com/sst-trainer?source=app')">Try again</button>
    <p class="hint">Your progress is safe — sessions sync when you&rsquo;re back online.</p>
  </div>
</body>
</html>
