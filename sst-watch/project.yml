name: SSTWatch
options:
  bundleIdPrefix: au.com.concussioneducation
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  SSTWatch:
    type: application
    platform: watchOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.concussioneducation.sst.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Explicit Info.plist: watchOS app + HealthKit usage strings + the
    # workout-processing background mode so the HKWorkoutSession keeps
    # streaming heart rate while a training session runs with the wrist down.
    info:
      path: Sources/Info.plist
      properties:
        WKApplication: true
        # Standalone watch app, no iPhone companion — required for install.
        WKWatchOnly: true
        NSHealthShareUsageDescription: "SST Trainer reads your heart rate during the graded test and training sessions to pace your recovery to your measured threshold."
        NSHealthUpdateUsageDescription: "SST Trainer records your training sessions as workouts."
        WKBackgroundModes:
          - workout-processing
    entitlements:
      path: Sources/SSTWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
